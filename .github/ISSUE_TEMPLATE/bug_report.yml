# bug_report.yml
# SwiftFoundationHelpers
#
# Copyright © 2026 Dagitali LLC. All rights reserved.
#
# GitHub issue form for reporting reproducible bugs.
#
# Responsibilities
# - Gather the minimum information needed to reproduce and triage defects.
#
# Maintainer Notes
# - Keep the prompts focused on actionable reproduction details for
#   maintainers.
# - Keep shared prompts applicable to Swift packages and Apple-platform apps.
# - Keep package-specific prompts limited to environment and integration data
#   required to reproduce library defects.
#
# References
# - GitHub issue templates:
#   https://docs.github.com/en/repositories/
#   managing-your-repositorys-settings-and-features/customizing-your-repository/
#   configuring-issue-templates-for-your-repository
# - GitHub issue forms syntax:
#   https://docs.github.com/en/repositories/
#   managing-your-repositorys-settings-and-features/customizing-your-repository/
#   syntax-for-issue-forms

---

name: Bug Report
description: Report a reproducible problem or defect in SwiftFoundationHelpers.
title: "[Bug] "
labels:
  - bug
  - needs-triage
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please include enough detail for maintainers
        to reproduce the problem on a clean checkout, installation, or package
        integration. Report suspected vulnerabilities privately as described in
        [SECURITY.md](https://github.com/Dagitali/SwiftFoundationHelpers/security/policy).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the problem and its impact.
      placeholder: >-
        A concise description of the SwiftFoundationHelpers bug.
    validations:
      required: true
  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      description: Which parts of SwiftFoundationHelpers appear to be affected?
      multiple: true
      options:
        - Existing Foundation extension
        - Public API or source compatibility
        - Package manifest, resolution, or integration
        - Platform availability or behavior
        - Tests
        - Documentation or DocC
        - CI, release, or repository automation
        - Other
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      description: Where did you observe the problem?
      multiple: true
      options:
        - iOS
        - iPadOS
        - Mac Catalyst
        - macOS
        - tvOS
        - visionOS
        - watchOS
        - Linux
        - Windows
        - Not platform-specific
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction steps
      description: >-
        Provide exact steps, commands, sample inputs, or a link to a small
        reproduction package that imports SwiftFoundationHelpers directly.
      placeholder: |
        1. Resolve or build ...
        2. Call or test ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: minimal-reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest relevant call site or test.
      render: swift
    validations:
      required: false
  - type: textarea
    id: observed
    attributes:
      label: Observations
      description: >-
        Describe what you saw. Include screenshots, logs, failing test output,
        or exact error messages if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expectations
      description: >-
        Describe what you expected to see.
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: SwiftFoundationHelpers version or commit
      description: Which release, tag, branch, or commit shows the problem?
      placeholder: v1.2.3 or abc1234
    validations:
      required: true
  - type: input
    id: swift-version
    attributes:
      label: Swift version
      description: Paste the first line of `swift --version`.
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating system version
      description: Include the exact host or device operating system version.
      placeholder: macOS 15.6, iOS 18.5, Ubuntu 24.04, or Windows 11
    validations:
      required: true
  - type: input
    id: xcode-version
    attributes:
      label: Xcode version
      description: Provide the version when Xcode or an Apple SDK is involved.
    validations:
      required: false
  - type: input
    id: host-target
    attributes:
      label: Build host and target
      description: Identify both when building for a different target platform.
      placeholder: macOS 15.6 host targeting iOS 18.5
    validations:
      required: false
  - type: dropdown
    id: integration-source
    attributes:
      label: Package integration source
      description: How are you consuming or running SwiftFoundationHelpers?
      options:
        - Swift test target
        - SwiftPM dependency using a released version
        - SwiftPM dependency using a branch or commit
        - Xcode build from a source checkout
        - Xcode-integrated Swift package
        - Xcode test target
        - Local package or source checkout
        - GitHub Actions or another CI environment
        - Other
    validations:
      required: true
  - type: textarea
    id: dependency
    attributes:
      label: Package dependency declaration
      description: >-
        Include the relevant SwiftPM dependency and target declaration.
      render: swift
    validations:
      required: false
  - type: input
    id: last-working-version
    attributes:
      label: Last working version
      description: >-
        If this is a regression, provide the last known working version.
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Include searchable compiler, runtime, or test output after removing
        credentials, private paths, personal data, and other sensitive values.
      render: shell
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, links, or other relevant context.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: >-
            I searched existing issues, discussions, and pull requests and did
            not find a duplicate.
          required: true
        - label: >-
            I identified the affected version and, when practical, checked the
            latest stable release or default branch.
          required: true
        - label: >-
            I included enough information for maintainers to reproduce or
            investigate the issue.
          required: true
        - label: >-
            I did not include vulnerability details or sensitive data (secrets,
            private source, personal data, etc.).
          required: true
