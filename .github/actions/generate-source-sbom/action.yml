#
# Composite action for generating an SPDX source-inventory SBOM.
#
# Responsibilities
# - Inventory committed repository files without following working-tree
#   symlinks.
# - Describe the software-to-file relationships and package verification code.
# - Keep artifact upload policy in the calling workflow.
#
# Maintainer Notes
# - This is a source inventory, not a full dependency SBOM.
# - Hash committed Git blobs so the SBOM describes the triggering revision.
# - An empty `file-patterns` input inventories every tracked file; callers may
#   supply newline-separated Git pathspecs to narrow that scope.
# - Keep generation logic beside this metadata and resolve it through
#   `github.action_path` so the action remains self-contained when used from a
#   different repository.
# - The generator requires Python 3.9 or later and only uses its standard
#   library plus Git.
# - Keep artifact naming, retention, and release gating in the caller.
#
# References
# - GitHub composite action guide:
#   https://docs.github.com/en/actions/tutorials/create-actions/
#   create-a-composite-action
# - GitHub Actions metadata reference:
#   https://docs.github.com/en/actions/reference/workflows-and-actions/
#   metadata-syntax
# - SPDX specifications:
#   https://spdx.dev/use/specifications/

---

name: Generate source SBOM
description: Generate an SPDX source-inventory SBOM from committed files.

inputs:
  output-path:
    description: Destination path for the SPDX JSON document.
    required: true
  document-name:
    description: SPDX document name; defaults to the repository name.
    required: false
    default: ''
  namespace-slug:
    description: Namespace slug; defaults to source-inventory-sbom.
    required: false
    default: ''
  file-patterns:
    description: Newline-separated Git pathspecs; empty includes all files.
    required: false
    default: ''
  repository-root:
    description: Git worktree to inventory; defaults to the current directory.
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Generate SBOM
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        DOCUMENT_NAME: ${{ inputs.document-name }}
        FILE_PATTERNS: ${{ inputs.file-patterns }}
        NAMESPACE_SLUG: ${{ inputs.namespace-slug }}
        OUTPUT_PATH: ${{ inputs.output-path }}
        REPOSITORY_ROOT: ${{ inputs.repository-root }}
      run: |
        python3 "$ACTION_PATH/generate_source_sbom.py" \
          --output-path "$OUTPUT_PATH" \
          --document-name "$DOCUMENT_NAME" \
          --namespace-slug "$NAMESPACE_SLUG" \
          --file-patterns "$FILE_PATTERNS" \
          --repository-root "$REPOSITORY_ROOT"
