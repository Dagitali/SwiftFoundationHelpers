# action.yml
# SwiftFoundationHelpers
#
# Copyright © 2026 Dagitali LLC. All rights reserved.
#
# A composite action that prepares Swift for host builds and tests.
#
# Responsibilities
# - Install the configured Swift toolchain on Linux and macOS runners.
# - Install Swift from its official versioned Windows release installer.
# - Propagate the Windows Swift SDK environment to subsequent workflow steps.
# - Verify that Swift can compile the package manifest.
#
# Maintainer Notes
# - Keep the default Swift version aligned with the repository's formatter and
#   current stable Swift release while preserving `Package.swift` compatibility.
# - Skip Windows installation when the runner already exposes Swift in `PATH`.
# - Keep the Windows download URL aligned with Swift's official release layout.
# - Keep Windows runners on an image containing Swift's required Visual Studio
#   2022 C++ toolchain and Windows SDK components.
# - Replace the pinned v3 prerelease after a stable v3 release is reviewed.
# - Pin third-party actions to reviewed full commit SHAs.
#
# References
# - Swift installation documentation:
#   https://www.swift.org/install/
# - Swift installation documentation for Windows:
#   https://www.swift.org/install/windows/
# - Swift setup action:
#   https://github.com/swift-actions/setup-swift
# - GitHub composite action guide:
#   https://docs.github.com/en/actions/tutorials/create-actions/
#   create-a-composite-action

---

name: Set up Swift host
description: Prepare Swift on Linux, macOS, or Windows runners.

inputs:
  swift-version:
    description: Stable Swift version to install on each host runner.
    required: false
    default: '6.3.3'

runs:
  using: composite
  steps:
    - name: Set up Swift on macOS and Linux
      if: runner.os != 'Windows'
      # Pinned v3.0.0-beta.1
      uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9
      with:
        swift-version: ${{ inputs.swift-version }}

    - name: Install Swift on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (-not (Get-Command swift -ErrorAction SilentlyContinue)) {
          $version = '${{ inputs.swift-version }}'
          $release = "swift-$version-RELEASE"
          $baseUrl = @(
            "https://download.swift.org"
            "swift-$version-release"
            "windows10"
          ) -join "/"
          $installerUrl = "$baseUrl/$release/$release-windows10.exe"
          $installerPath = Join-Path `
            $env:RUNNER_TEMP `
            "$release-windows10.exe"

          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath
          try {
            $installer = Start-Process `
              -FilePath $installerPath `
              -ArgumentList "/quiet", "/norestart" `
              -Wait `
              -PassThru
            if ($installer.ExitCode -notin @(0, 3010)) {
              $exitCode = $installer.ExitCode
              throw "Swift installer failed with exit code $exitCode."
            }
          } finally {
            Remove-Item $installerPath -Force -ErrorAction SilentlyContinue
          }
        }

        $machinePath = [Environment]::GetEnvironmentVariable(
          "Path",
          "Machine"
        )
        $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
        $pathEntries = "$machinePath;$userPath" -split ";" |
          Where-Object { $_ } |
          Select-Object -Unique
        $env:Path = $pathEntries -join ";"
        $pathEntries | ForEach-Object { $_ >> $env:GITHUB_PATH }

        $sdkRoot = @(
          [Environment]::GetEnvironmentVariable("SDKROOT", "User")
          [Environment]::GetEnvironmentVariable("SDKROOT", "Machine")
        ) | Where-Object { $_ -and (Test-Path $_) } |
          Select-Object -First 1

        if (-not $sdkRoot) {
          $swiftHome = (Get-Command swift -ErrorAction Stop).Source
          foreach ($level in 1..5) {
            $swiftHome = Split-Path $swiftHome -Parent
          }
          $sdkRoot = Get-ChildItem `
            -Path (Join-Path $swiftHome "Platforms") `
            -Filter Windows.sdk `
            -Directory `
            -Recurse |
            Select-Object -ExpandProperty FullName -First 1
        }

        if (-not $sdkRoot -or -not (Test-Path $sdkRoot)) {
          throw "The Swift Windows SDK could not be located."
        }

        $env:SDKROOT = $sdkRoot
        "SDKROOT=$sdkRoot" >> $env:GITHUB_ENV

    - name: Verify Swift toolchain on macOS and Linux
      if: runner.os != 'Windows'
      shell: bash
      run: |
        swift --version
        swift package dump-package > /dev/null

    - name: Verify Swift toolchain on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        swift --version
        swift package dump-package | Out-Null
