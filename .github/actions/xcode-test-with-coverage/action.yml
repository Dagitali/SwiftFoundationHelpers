#
# Composite action for Xcode test execution and coverage export.
#
# Responsibilities
# - Resolve either an explicit destination or an available latest Simulator.
# - Test a project, workspace, or Swift package scheme with code coverage.
# - Export a compact `xccov` JSON report from the result bundle.
#
# Maintainer Notes
# - Keep project, workspace, and scheme selection in callers so this action is
#   reusable across Apple-platform apps and Swift packages.
# - Keep destination discovery independent of hard-coded device names.
# - Keep result and coverage artifact upload policy in the calling workflow.
# - Preserve coverage export after failures when a result bundle exists.
# - Keep code signing disabled because this action validates source and tests,
#   not distribution archives.
#
# References
# - GitHub composite action guide:
#   https://docs.github.com/en/actions/tutorials/create-actions/
#   create-a-composite-action
# - GitHub Actions metadata reference:
#   https://docs.github.com/en/actions/reference/workflows-and-actions/
#   metadata-syntax
# - Xcode command-line tool reference:
#   https://developer.apple.com/documentation/xcode/
#   xcode-command-line-tool-reference

---

name: Test with Xcode coverage
description: Test an Apple-platform scheme and export an xccov JSON report.

inputs:
  scheme:
    description: Xcode scheme to test.
    required: true
  project-path:
    description: Optional Xcode project path; omit for Swift packages.
    required: false
    default: ''
  workspace-path:
    description: Optional Xcode workspace path; mutually exclusive with project.
    required: false
    default: ''
  destination:
    description: Explicit xcodebuild test destination.
    required: false
    default: ''
  simulator-platform:
    description: Apple Simulator platform to resolve when destination is empty.
    required: false
    default: ''
  working-directory:
    description: Repository-relative directory containing the Xcode container.
    required: false
    default: '.'
  derived-data-path:
    description: DerivedData path.
    required: true
  result-bundle-path:
    description: xcresult bundle output path.
    required: true
  coverage-report-path:
    description: xccov JSON report output path.
    required: true

runs:
  using: composite
  steps:
    - name: Show Xcode version
      shell: bash
      run: xcodebuild -version

    - name: Resolve test destination
      id: destination
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        DESTINATION: ${{ inputs.destination }}
        SIMULATOR_PLATFORM: ${{ inputs.simulator-platform }}
      run: |
        if [[ -n "$DESTINATION" ]]; then
          printf 'value=%s\n' "$DESTINATION" >> "$GITHUB_OUTPUT"
        elif [[ -n "$SIMULATOR_PLATFORM" ]]; then
          simulator_id=$(
            python3 "$ACTION_PATH/select_simulator.py" "$SIMULATOR_PLATFORM"
          )
          printf 'value=id=%s\n' "$simulator_id" >> "$GITHUB_OUTPUT"
        else
          echo 'Provide either destination or simulator-platform.' >&2
          exit 1
        fi

    - name: Run tests
      shell: bash
      env:
        DERIVED_DATA_PATH: ${{ inputs.derived-data-path }}
        DESTINATION: ${{ steps.destination.outputs.value }}
        PROJECT_PATH: ${{ inputs.project-path }}
        RESULT_BUNDLE_PATH: ${{ inputs.result-bundle-path }}
        SCHEME: ${{ inputs.scheme }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        WORKSPACE_PATH: ${{ inputs.workspace-path }}
      run: |
        if [[ -n "$PROJECT_PATH" && -n "$WORKSPACE_PATH" ]]; then
          echo 'project-path and workspace-path are mutually exclusive.' >&2
          exit 1
        fi

        container_arguments=()
        if [[ -n "$PROJECT_PATH" ]]; then
          container_arguments=(-project "$PROJECT_PATH")
        elif [[ -n "$WORKSPACE_PATH" ]]; then
          container_arguments=(-workspace "$WORKSPACE_PATH")
        fi

        cd "$WORKING_DIRECTORY"
        mkdir -p "$(dirname "$DERIVED_DATA_PATH")"
        mkdir -p "$(dirname "$RESULT_BUNDLE_PATH")"
        xcodebuild test \
          "${container_arguments[@]}" \
          -scheme "$SCHEME" \
          -destination "$DESTINATION" \
          -derivedDataPath "$DERIVED_DATA_PATH" \
          -resultBundlePath "$RESULT_BUNDLE_PATH" \
          -enableCodeCoverage YES \
          CODE_SIGNING_ALLOWED=NO

    - name: Export coverage report
      if: ${{ !cancelled() }}
      shell: bash
      env:
        COVERAGE_REPORT_PATH: ${{ inputs.coverage-report-path }}
        RESULT_BUNDLE_PATH: ${{ inputs.result-bundle-path }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        cd "$WORKING_DIRECTORY"
        if [[ -d "$RESULT_BUNDLE_PATH" ]]; then
          mkdir -p "$(dirname "$COVERAGE_REPORT_PATH")"
          xcrun xccov view --report --json "$RESULT_BUNDLE_PATH" \
            > "$COVERAGE_REPORT_PATH"
        else
          message="No result bundle found at $RESULT_BUNDLE_PATH"
          echo "::warning title=Coverage unavailable::$message"
        fi
