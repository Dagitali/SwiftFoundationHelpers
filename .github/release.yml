# release.yml
# SwiftFoundationHelpers
#
# Copyright © 2026 Dagitali LLC. All rights reserved.
#
# GitHub configuration for automatically generated release notes.
#
# Responsibilities
# - Define how GitHub categorizes merged pull requests in generated release
#   notes.
# - Exclude pull requests that intentionally should not appear in release
#   notes.
#
# Maintainer Notes
# - Combine generated notes with `.github/RELEASE-NOTES-TEMPLATE.md` when
#   drafting the final release text.
# - Exclusions are applied before categorization.
# - Categories are evaluated in order; a pull request appears in the first
#   category matching one of its labels.
# - Keep the catch-all category last so unmatched pull requests remain visible.
# - Labels referenced below must exist in the repository and be applied before
#   generating release notes.
#
# References
# - GitHub release documentation:
#   https://docs.github.com/en/repositories/releasing-projects-on-github

---

changelog:
  exclude:
    labels:
      - ignore-for-release
      - internal
      - no-release-notes
      - skip-release-notes
    authors:
      - octocat
  categories:
    - title: Breaking Changes
      labels:
        - release-note:breaking-change
        - semver-major
        - breaking
        - breaking-change
    - title: Highlights
      labels:
        - release-note:feature
        - semver-minor
        - enhancement
        - feature
    - title: Fixes
      labels:
        - release-note:fix
        - semver-patch
        - bug
        - bugfix
        - fix
    - title: Compatibility and Dependencies
      labels:
        - release-note:compatibility
        - release-note:dependencies
        - compatibility
        - dependencies
        - platform-support
    - title: Deprecations
      labels:
        - release-note:deprecation
        - deprecated
        - deprecation
    - title: Documentation
      labels:
        - release-note:documentation
        - docs
        - documentation
    - title: Validation and Testing
      labels:
        - release-note:validation
        - release-note:testing
        - test
        - testing
        - tests
        - validation
    - title: Release and Distribution
      labels:
        - release-note:release-readiness
        - distribution
        - release
        - release-readiness
    - title: Maintenance
      labels:
        - release-note:maintenance
        - automation
        - chore
        - ci
        - pre-commit
        - refactor
    - title: Security
      labels:
        - release-note:security
        - security
    - title: Other Changes
      labels:
        - "*"
