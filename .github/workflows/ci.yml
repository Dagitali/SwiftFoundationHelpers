# ci.yml
# SwiftFoundationHelpers
#
# Copyright © 2026 Dagitali LLC. All rights reserved.
#
# Responsibilities
# - Run broader platform validation for protected/long-lived GitFlow
#   integration branches.
# - Test with coverage on Linux, macOS, and Windows hosts through SwiftPM.
# - Compile against every declared Apple platform SDK with Xcode.
# - Test with coverage on every declared Apple platform destination.
# - Validate integration branches after changes merge.
# - Upload per-host and per-Apple-destination coverage and test results.
#
# Maintainer Notes
# - Global permissions are intentionally set to none; each job declares the
#   minimum permissions it needs.
# - External GitHub Actions are pinned to full commit SHAs to reduce supply-
#   chain risk.
# - Keep required pull-request and merge-queue gates in `pr.yml`.
# - CI intentionally follows the Xcode version selected by the hosted image
#   so compatibility changes surface before release. Release workflows pin
#   their validated Xcode toolchain for reproducibility.
# - This workflow intentionally complements, rather than replaces, the lighter
#   integration checks that run earlier in the development loop.
# - The dynamic run name is part of the workflow contract: it should identify
#   the integration branch or manual trigger for review clarity.
#
# References
# - Building and testing Swift with GitHub Actions:
#   https://docs.github.com/en/actions/tutorials/build-and-test-code/swift
# - Xcode command-line tool reference:
#   https://developer.apple.com/documentation/xcode/
#   xcode-command-line-tool-reference
# - GitHub Actions expressions reference:
#   https://docs.github.com/en/actions/reference/workflows-and-actions/
#   expressions
# - GitHub Actions security hardening guide:
#   https://docs.github.com/en/actions/reference/security/secure-use
# - GitHub Actions workflow syntax reference:
#   https://docs.github.com/en/actions/reference/workflows-and-actions/
#   workflow-syntax

---

name: CI

run-name: >-
  ${{
    github.event_name == 'push' &&
    format('CI: push on {0}', github.ref_name) ||
    'CI: manual dispatch'
  }}

"on":
  push:
    branches:
      - develop
      - main
      - 'release/**'
      - 'hotfix/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-test:
    name: Host Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
            artifact: linux
          - name: macOS
            runner: macos-26
            artifact: macos
          - name: Windows
            runner: windows-2025
            artifact: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        # Pinned v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Swift host
        uses: ./.github/actions/setup-swift-host

      - name: Test package with coverage
        run: swift test --parallel --enable-code-coverage

      - name: Collect coverage report on Unix
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          coverage_path=$(swift test --show-codecov-path)
          output_path="$RUNNER_TEMP/SwiftFoundationHelpers-codecov.json"

          if [[ -f "$coverage_path" ]]; then
            cp "$coverage_path" "$output_path"
          else
            echo "No coverage report found at $coverage_path"
            exit 1
          fi

      - name: Collect coverage report on Windows
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $coveragePath = swift test --show-codecov-path
          $outputPath = "$env:RUNNER_TEMP/SwiftFoundationHelpers-codecov.json"

          if (Test-Path $coveragePath) {
            Copy-Item $coveragePath $outputPath
          } else {
            throw "No coverage report found at $coveragePath"
          }

      - name: Upload coverage report
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: >-
            swiftfoundationhelpers-${{ matrix.artifact }}-host-coverage
          path: ${{ runner.temp }}/SwiftFoundationHelpers-codecov.json
          if-no-files-found: error
          retention-days: '14'

  apple-platform-build:
    name: Apple Platform Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            destination: generic/platform=iOS
            derived_data: iOS
          - name: Mac Catalyst
            destination: generic/platform=macOS,variant=Mac Catalyst
            derived_data: MacCatalyst
          - name: macOS
            destination: platform=macOS
            derived_data: macOS
          - name: tvOS
            destination: generic/platform=tvOS
            derived_data: tvOS
          - name: visionOS
            destination: generic/platform=visionOS
            derived_data: visionOS
          - name: watchOS
            destination: generic/platform=watchOS
            derived_data: watchOS
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        # Pinned v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Build for ${{ matrix.name }}
        uses: ./.github/actions/xcode-package-build
        with:
          scheme: SwiftFoundationHelpers
          destination: ${{ matrix.destination }}
          derived-data-path: >-
            ${{ runner.temp }}/DerivedData/${{ matrix.derived_data }}

  apple-platform-test:
    name: Apple Platform Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            destination: ''
            simulator_platform: iOS
            artifact: ios
          - name: Mac Catalyst
            destination: platform=macOS,variant=Mac Catalyst
            simulator_platform: ''
            artifact: mac-catalyst
          - name: macOS
            destination: platform=macOS
            simulator_platform: ''
            artifact: macos
          - name: tvOS
            destination: ''
            simulator_platform: tvOS
            artifact: tvos
          - name: visionOS
            destination: ''
            simulator_platform: visionOS
            artifact: visionos
          - name: watchOS
            destination: ''
            simulator_platform: watchOS
            artifact: watchos
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        # Pinned v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Test on ${{ matrix.name }}
        uses: ./.github/actions/xcode-package-test-with-coverage
        with:
          scheme: SwiftFoundationHelpers
          destination: ${{ matrix.destination }}
          simulator-platform: ${{ matrix.simulator_platform }}
          derived-data-path: >-
            ${{ runner.temp }}/DerivedData/Test-${{ matrix.artifact }}
          result-bundle-path: >-
            ${{ runner.temp }}/${{ matrix.artifact }}-tests.xcresult
          coverage-report-path: >-
            ${{ runner.temp }}/${{ matrix.artifact }}-coverage.json

      - name: Upload test result
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: swiftfoundationhelpers-${{ matrix.artifact }}-test-result
          path: ${{ runner.temp }}/${{ matrix.artifact }}-tests.xcresult
          if-no-files-found: error
          retention-days: '14'

      - name: Upload coverage report
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: swiftfoundationhelpers-${{ matrix.artifact }}-coverage
          path: ${{ runner.temp }}/${{ matrix.artifact }}-coverage.json
          if-no-files-found: error
          retention-days: '14'
