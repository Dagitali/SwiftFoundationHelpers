# ci.yml
# SwiftFoundationHelpers
#
# Copyright © 2026 Dagitali LLC. All rights reserved.
#
# Responsibilities
# - Run broader platform validation for protected/long-lived GitFlow
#   integration branches.
# - Test the package on Linux, macOS, and Windows hosts.
# - Compile against every declared Apple platform SDK with Xcode.
# - Run one macOS Xcode test for coverage evidence.
# - Validate integration branches after changes merge.
# - Upload failed test result bundles and compact coverage reports.
#
# Maintainer Notes
# - Global permissions are intentionally set to none; each job declares the
#   minimum permissions it needs.
# - External GitHub Actions are pinned to full commit SHAs to reduce supply-
#   chain risk.
# - Keep required pull-request and merge-queue gates in `pr.yml`.
# - CI intentionally follows the Xcode version selected by the hosted image
#   so compatibility changes surface before release. Release workflows pin
#   their validated Xcode toolchain for reproducibility.
# - This workflow intentionally complements, rather than replaces, the lighter
#   integration checks that run earlier in the development loop.
# - The dynamic run name is part of the workflow contract: it should identify
#   the integration branch or manual trigger for review clarity.
#
# References
# - Building and testing Swift with GitHub Actions:
#   https://docs.github.com/en/actions/tutorials/build-and-test-code/swift
# - Xcode command-line tool reference:
#   https://developer.apple.com/documentation/xcode/
#   xcode-command-line-tool-reference
# - GitHub Actions expressions reference:
#   https://docs.github.com/en/actions/reference/workflows-and-actions/
#   expressions
# - GitHub Actions security hardening guide:
#   https://docs.github.com/en/actions/reference/security/secure-use
# - GitHub Actions workflow syntax reference:
#   https://docs.github.com/en/actions/reference/workflows-and-actions/
#   workflow-syntax

---

name: CI

run-name: >-
  ${{
    github.event_name == 'push' &&
    format('CI: push on {0}', github.ref_name) ||
    'CI: manual dispatch'
  }}

"on":
  push:
    branches:
      - develop
      - main
      - 'release/**'
      - 'hotfix/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-test:
    name: Host Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-26
          - name: Windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        # Pinned v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Swift host
        uses: ./.github/actions/setup-swift-host

      - name: Test package
        run: swift test --parallel

  apple-platform-build:
    name: Apple Platform Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            destination: generic/platform=iOS
            derived_data: iOS
          - name: Mac Catalyst
            destination: generic/platform=macOS,variant=Mac Catalyst
            derived_data: MacCatalyst
          - name: macOS
            destination: platform=macOS
            derived_data: macOS
          - name: tvOS
            destination: generic/platform=tvOS
            derived_data: tvOS
          - name: visionOS
            destination: generic/platform=visionOS
            derived_data: visionOS
          - name: watchOS
            destination: generic/platform=watchOS
            derived_data: watchOS
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        # Pinned v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Build for ${{ matrix.name }}
        uses: ./.github/actions/xcode-package-build
        with:
          scheme: SwiftFoundationHelpers
          destination: ${{ matrix.destination }}
          derived-data-path: >-
            ${{ runner.temp }}/DerivedData/${{ matrix.derived_data }}

  apple-platform-test:
    name: Apple Platform Test (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        # Pinned v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Test on macOS
        uses: ./.github/actions/xcode-package-test-with-coverage
        with:
          scheme: SwiftFoundationHelpers
          destination: platform=macOS
          derived-data-path: ${{ runner.temp }}/DerivedData/macOSTests
          result-bundle-path: >-
            ${{ runner.temp }}/SwiftFoundationHelpers-macOS.xcresult
          coverage-report-path: >-
            ${{ runner.temp }}/SwiftFoundationHelpers-macOS-coverage.json

      - name: Upload failed test result
        if: failure()
        uses: ./.github/actions/upload-artifact
        with:
          name: swiftfoundationhelpers-macOS-test-result
          path: ${{ runner.temp }}/SwiftFoundationHelpers-macOS.xcresult
          if-no-files-found: warn
          retention-days: '14'

      - name: Upload coverage report
        if: always()
        uses: ./.github/actions/upload-artifact
        with:
          name: swiftfoundationhelpers-macOS-coverage
          path: >-
            ${{ runner.temp }}/SwiftFoundationHelpers-macOS-coverage.json
          if-no-files-found: warn
          retention-days: '14'
