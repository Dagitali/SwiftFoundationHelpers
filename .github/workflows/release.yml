#
# GitHub Actions workflow for GitFlow release orchestration.
#
# GitFlow is an opinionated feature-based Git branching model with:
#
# * 2 long-running branches:
#   1. `develop`: For continuous development
#   2. `main`: For automatically deploying to production
#
# * Short-lived branches in between with enforced prefix conventions:
#   1. `bugfix/`:
#      * Created from the `develop` branch.
#      * Used to correct unreleased behavior.
#      * Removed after merging to the `develop` branch.
#   2. `feature/`:
#      * Created from the `develop` branch.
#      * Used to add/enhance/refactor features.
#      * Removed after merging to the `develop` branch.
#   3. `hotfix/`:
#      * Created from the `main` branch.
#      * Used to create hot fixes (i.e., emergency software patches).
#      * Removed after merging to both the `main` and `develop` branches.
#   4. `release/`:
#      * Created from the `develop` branch.
#      * Used to perform release preparation tasks.
#      * Removed after merging to both the `main` and `develop` branches.
#
# Responsibilities
# - Run the configured GitFlow release action after an eligible event.
# - Coordinate the repository's `develop` and `main` branches.
# - Accept a manually supplied semantic version for dispatched releases.
#
# Maintainer Notes
# - Keep branch behavior aligned with `RELEASE-POLICY.md` and branch rules.
# - Review third-party action behavior and pin it to a full commit SHA.
# - Avoid automatic branch mutation when protected-branch rules require PRs.
# - Closed pull requests must be merged release or hotfix pull requests that
#   target `main`; unrelated and unmerged pull requests are ignored.
#
# References
# - GitFlow workflow guidance:
#   https://www.atlassian.com/git/tutorials/comparing-workflows/
#   gitflow-workflow
# - GitFlow workflow action:
#   https://github.com/hoangvvo/gitflow-workflow-action
# - GitHub Actions workflow syntax reference:
#   https://docs.github.com/en/actions/reference/workflows-and-actions/
#   workflow-syntax

---

name: Release

run-name: >-
  ${{
    github.event_name == 'workflow_dispatch' &&
    format('Release: prepare {0}', inputs.version) ||
    format('Release: finish {0}', github.head_ref)
  }}

"on":
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: SemVer version to release
  pull_request:
    branches:
      - main
    types:
      - closed

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Coordinate GitFlow release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        (
          startsWith(github.head_ref, 'release/') ||
          startsWith(github.head_ref, 'hotfix/')
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Coordinate release branches
        # Pinned 0.3.7
        # yamllint disable-line rule:line-length
        uses: hoangvvo/gitflow-workflow-action@6f190b60eedc913790eeeee8077426c297ea9c0e
        with:
          develop_branch: develop
          main_branch: main
          merge_back_from_main: false
          version: ${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
