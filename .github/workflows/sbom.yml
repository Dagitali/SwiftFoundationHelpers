# sbom.yml
# SwiftFoundationHelpers
#
# Copyright © 2026 Dagitali LLC. All rights reserved.
#
# GitHub Actions workflow for Software Bill of Materials (SBOM) generation.
#
# Responsibilities
# - Generate an SPDX JSON inventory for the Swift package source tree.
# - Upload the generated SBOM as a workflow artifact for release review.
# - Keep SBOM generation independent from release publication workflows.
#
# Maintainer Notes
# - Global permissions are intentionally set to none; each job declares the
#   minimum permissions it needs.
# - External GitHub Actions are pinned to full commit SHAs to reduce supply-
#   chain risk.
# - The dynamic run name is part of the workflow contract: it should identify
#   the event trigger for clarity.
# - This source inventory represents tracked manifests and lockfiles; it does
#   not construct an SPDX dependency-component graph.
# - Keep inventory generation in `.github/actions/generate-source-sbom` and
#   artifact policy in this workflow.
# - Path filters mirror the source-inventory inputs and their automation.
# - Adopt a SwiftPM-aware generator if third-party runtime dependencies are
#   introduced and dependency components become part of the SBOM contract.
#
# References
# - SBOM documentation:
#   https://www.cisa.gov/topics/information-communications-technology-
#   supply-chain-security/sbom
# - GitHub Actions security hardening guide:
#   https://docs.github.com/en/actions/reference/security/secure-use
# - GitHub Actions expressions reference:
#   https://docs.github.com/en/actions/reference/workflows-and-actions/
#   expressions
# - GitHub Actions workflow syntax reference:
#   https://docs.github.com/en/actions/reference/workflows-and-actions/
#   workflow-syntax
# - GitHub Actions artifact upload guide:
#   https://docs.github.com/en/actions/tutorials/store-and-share-data
# - SPDX SBOM documentation:
#   https://spdx.dev/use/specifications/

---

name: SBOM

run-name: >-
  ${{ case(
    github.event_name == 'pull_request',
    format('SBOM: {0} -> {1}', github.head_ref, github.base_ref),
    github.event_name == 'push',
    format('SBOM: push on {0}', github.ref_name),
    'SBOM: manual dispatch'
  ) }}

"on":
  push:
    branches:
      # Protected/long-lived GitFlow branches
      - main
      - develop

      # Release-oriented GitFlow branches
      - 'release/**'
      - 'hotfix/**'
    paths: &sbom-paths
      - 'Package.swift'
      - 'Package.resolved'
      - 'Sources/**'
      - 'Tests/**'
      - 'LICENSE*'
      - '.github/actions/generate-source-sbom/action.yml'
      - '.github/actions/generate-source-sbom/generate_source_sbom.py'
      - '.github/actions/upload-artifact/action.yml'
      - '.github/workflows/sbom.yml'
  pull_request:
    branches:
      # Protected/long-lived GitFlow branches
      - main
      - develop
    paths: *sbom-paths
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  SBOM_FILENAME: ${{ github.event.repository.name }}-source.spdx.json

jobs:
  generate-sbom:
    name: Generate package source inventory SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        # Pinned v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Generate SBOM (SPDX package source inventory)
        uses: ./.github/actions/generate-source-sbom
        with:
          output-path: ${{ runner.temp }}/${{ env.SBOM_FILENAME }}
          document-name: SwiftFoundationHelpers
          namespace-slug: swift-package-sbom
          file-patterns: |
            Package.swift
            Package.resolved
            Sources/**
            Tests/**
            LICENSE*

      - name: Upload SBOM artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: source-sbom
          path: ${{ runner.temp }}/${{ env.SBOM_FILENAME }}
          retention-days: 30
