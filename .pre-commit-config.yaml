# .pre-commit-config.yaml
# SwiftFoundationHelpers
#
# Copyright © 2026 Dagitali LLC. All rights reserved.
#
# Pre-commit configuration for local Git hook automation.
#
# Pre-commit is a multi-language package manager and hook orchestrator that
# runs configured checks before code is committed or pushed. This configuration
# defines the hooks that are installed and run locally to catch issues. It
# enables code reviews to focus on design and implementation quality by
# automating checks for formatting, syntax, metadata, and repository hygiene
# issues.
#
# Responsibilities
# - Install and run local commit-message, pre-commit, and pre-push hooks.
# - Catch formatting, syntax, metadata, and repository-hygiene issues before
#   code review.
# - Keep local checks aligned with the repository's CI quality gates where
#   practical.
#
# Maintainer Notes
# - Keep branch and commit-message hooks aligned with the GitFlow rules
#   documented in `.github/BRANCH-PROTECTION.md`.
# - Prefer targeted hook exclusions over broad disables when generated or
#   nonstandard files need special handling.
#
# References
# - Git branch naming convention: https://www.devwithimagination.com/2020/04/
#   13/git-commit-hooks-for-branch-naming-pre-commit/
# - Pre-commit documentation: https://pre-commit.com
# - Pre-commit supported hooks reference: https://pre-commit.com/hooks.html
# - Pre-commit plugin reference: https://pre-commit.com/index.html#plugins

---

# Install the default commit, commit-message, and push hook types.
default_install_hook_types:
  - commit-msg
  - pre-commit
  - pre-push

default_language_version:
  swift: system

default_stages:
  - pre-commit

# Some configs are only available after v3.7.
minimum_pre_commit_version: "3.7"

# Check for issues or automatically fix issues.
repos:

  ### Pre-commit ###

  # Internal meta checks
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  ### Git ###

  # Conventional commits / branch naming
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.17.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
      - id: commitizen-branch
        stages:
          - post-commit
          - post-rewrite
          - pre-push

  ### Git, Polyglot ###

  # General hygiene checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      # - id: check-ast
      # - id: check-builtin-literals
      # - id: check-docstring-first
      # - id: check-executables-have-shebangs
      #   exclude_types: [batch]
      ## - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      # - id: check-symlinks
      # - id: check-toml
      - id: check-vcs-permalinks
      # - id: check-xml
      - id: check-yaml
      # - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-aws-credentials
      - id: detect-private-key
      # - id: double-quote-string-fixer
      - id: end-of-file-fixer
      # - id: file-contents-sorter
      - id: fix-byte-order-marker
      # - id: fix-encoding-pragma
      #   args: [--remove]
      # - id: forbid-new-submodules
      - id: mixed-line-ending
      # - id: name-tests-test
      #   args: [--pytest-test-first]
      - id: no-commit-to-branch
        args:
          - --pattern
          - >-
            ^(?!((bugfix|chore|ci|docs|feature|hotfix|release|sync)\/[a-zA-Z0-9\-\.]+)$).*
      ## - id: pretty-format-json
      ##  args: [--autofix, --no-sort-keys]
      # - id: requirements-txt-fixer
      # - id: sort-simple-yaml
      - id: trailing-whitespace

  ### Markdown ###

  # Markdown: Table of Contents updates
  - repo: https://github.com/frnmst/md-toc
    rev: 9.0.0
    hooks:
      - id: md-toc

  ### Swift ###

  # Swift formatting
  - repo: local
    hooks:
      - id: swift-format
        name: swift-format
        entry: xcrun swift-format
        args:
          - lint
          - --strict
          - --configuration
          - .swift-format
        language: system
        types: [swift]
        stages:
          - pre-push

  # - repo: https://github.com/realm/SwiftLint
  #   rev: 0.57.0
  #   hooks:
  #     - id: swiftlint
  #       name: swiftlint
  #       entry: swiftlint --quiet
  #       language: system
  #       types: [swift]

  ### YAML ###

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: yamllint
        entry: yamllint
        language: system
        types: [yaml]
